name: Release Build Check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (YYYYMMDD-suffix)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-build:
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_DIR: ""
    steps:
      - name: Set release dir
        run: echo "RELEASE_DIR=$RUNNER_TEMP/release/$VERSION" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install release dependencies
        run: |
          python3 -m pip install --upgrade pip openpyxl
          npm ci --prefix validation
          npx --prefix validation playwright install chromium

      - name: Write release secrets
        env:
          RTMIFY_LICENSE_HMAC_KEY: ${{ secrets.RTMIFY_LICENSE_HMAC_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$RTMIFY_LICENSE_HMAC_KEY" > "$RUNNER_TEMP/secrets/license-hmac-key.txt"
          echo "RTMIFY_LICENSE_HMAC_KEY_FILE=$RUNNER_TEMP/secrets/license-hmac-key.txt" >> "$GITHUB_ENV"

      - name: Build raw release artifacts
        run: ./release.sh --version "${VERSION}" --out-dir "${RELEASE_DIR}"
        env:
          PYTHON_BIN: ${{ env.pythonLocation }}/bin/python3

      - name: Upload raw release directory
        uses: actions/upload-artifact@v4
        with:
          name: raw-release-${{ inputs.version }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
